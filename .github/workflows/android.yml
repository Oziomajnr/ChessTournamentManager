name: Android CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-policy-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK Platform 36
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew scripts/verify_play_policy.sh

      - name: Run JVM tests and build debug APK
        run: ./gradlew --console=plain testDebugUnitTest assembleDebug

      - name: Verify Play policy requirements
        run: ./scripts/verify_play_policy.sh
