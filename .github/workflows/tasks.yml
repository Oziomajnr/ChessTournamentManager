name: Deliver a task

on:
  issues:
    types: [labeled]
  workflow_dispatch:
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'

permissions: {}
concurrency:
  group: task-controller
  cancel-in-progress: false

jobs:
  choose:
    if: >-
      ${{ github.ref == 'refs/heads/main' && vars.DELIVERY_AGENT_ENABLED == 'true' &&
          (github.event_name != 'issues' || github.event.label.name == 'agent-ready') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write
      statuses: write
    outputs:
      role: ${{ steps.task.outputs.role }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - id: task
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -m delivery.task choose
      - if: steps.task.outputs.role != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: task-input
          path: task-input.json
          retention-days: 2
  agent:
    needs: choose
    if: needs.choose.outputs.role != ''
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: delivery-agent
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: task-input
      - name: Generate a structured proposal from the approved task
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DELIVERY_MODEL: ${{ vars.DELIVERY_MODEL }}
        run: python3 -m delivery.adapters.openai task-input.json agent-result.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: agent-result
          path: agent-result.json
          retention-days: 2
  apply:
    needs: agent
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      statuses: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: task-input
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: agent-result
      - env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -m delivery.task apply
